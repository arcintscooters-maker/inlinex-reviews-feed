name: Build product reviews feed

on:
  schedule:
    - cron: "30 18 * * *" # daily 18:30 UTC = 02:30 SGT, before Merchant Center's 00:00 fetch in its own timezone window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-feed.mjs
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      - name: Commit the feed if it changed
        run: |
          git config user.name "inlinex-feed-bot"
          git config user.email "admin@inlinex.com.sg"
          git add docs/product-reviews.xml docs/summary.json docs/index.html docs/loox-cache.json
          git diff --cached --quiet && echo "no change" || (git commit -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
